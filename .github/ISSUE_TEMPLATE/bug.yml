name: Bug report
description: Report reproducible incorrect behavior
title: ""
body:
  - type: markdown
    attributes:
      value: >-
        Do not report security vulnerabilities here. Use the repository's
        private vulnerability-reporting flow instead.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable steps or example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment and additional context
