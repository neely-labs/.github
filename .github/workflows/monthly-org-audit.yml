name: Organization settings audit

on:
  workflow_dispatch:
  # Enable the schedule after the Neely Labs Settings Auditor GitHub App and
  # repository secrets are configured.
  # schedule:
  #   - cron: "17 14 1 * *"

permissions:
  contents: read

jobs:
  audit:
    name: Audit organization settings
    runs-on: ubuntu-latest
    steps:
      - name: Create audit token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ORG_AUDIT_APP_ID }}
          private-key: ${{ secrets.ORG_AUDIT_APP_PRIVATE_KEY }}
          owner: neely-labs
          repositories: .github
      - name: Check out policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit settings
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/audit-org
