name: PR Verify

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: PR Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository verification
        shell: bash
        run: ./scripts/ci
